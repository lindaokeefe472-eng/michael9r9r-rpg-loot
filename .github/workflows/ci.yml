name: RPG Loot Data Pack CI

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  static-verification:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Deep Verification (JSON syntax + cross-reference integrity)
      run: python tests/deep_verification.py

    - name: Package Release Artifacts (all version targets)
      run: python tools/package.py --all

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rpg-loot-release-zips
        path: build/*.zip

  # Runtime verification (real servers) is run locally per target:
  #   python tools/verify_target.py --target 26.2
  #   python tools/verify_target.py --target 1.21.4
  # Server jars are mapped in tools/servers.json. See MAINTENANCE.md.
